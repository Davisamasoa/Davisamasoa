<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Davi Machado, full stack developer">
  <defs>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" class="dot"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="900" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    .bg { fill: #0b0b0d; }
    .dot { fill: #ffffff; opacity: .07; }
    .border { fill: none; stroke: #ffffff; stroke-opacity: .08; }
    .name { fill: #f5f5f7; font: 700 54px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
    .role { fill: #a1a1a6; font: 500 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { fill: #a1a1a6; font: 500 17px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .accent { fill: #ff8a3d; }
    .chip { fill: #ffffff; fill-opacity: .06; stroke: #ffffff; stroke-opacity: .1; }
    .chiptext { fill: #d2d2d7; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .live { fill: #30d158; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #fbfbfd; }
      .dot { fill: #000000; opacity: .08; }
      .border { stroke: #000000; stroke-opacity: .08; }
      .name { fill: #1d1d1f; }
      .role, .mono { fill: #6e6e73; }
      .chip { fill: #000000; fill-opacity: .04; stroke: #000000; stroke-opacity: .08; }
      .chiptext { fill: #3a3a3c; }
      .live { fill: #28a745; }
    }

    .orbA { animation: driftA 14s ease-in-out infinite alternate; }
    .orbB { animation: driftB 18s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(-70px,40px); } }
    @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(60px,-30px); } }

    .fade { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .w { opacity: 0; animation: cycle 12s infinite; }
    .w2 { animation-delay: 4s; } .w3 { animation-delay: 8s; }
    @keyframes cycle { 0% { opacity: 0; } 3% { opacity: 1; } 30% { opacity: 1; } 33% { opacity: 0; } 100% { opacity: 0; } }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .pulse { transform-origin: 62px 246px; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(2.6); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .orbA, .orbB, .pulse, .caret { animation: none; }
      .fade { animation: none; opacity: 1; }
      .w { animation: none; } .w1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect class="bg" width="900" height="300"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <circle class="orbA" cx="760" cy="70" r="220" fill="url(#orbA)"/>
    <circle class="orbB" cx="640" cy="290" r="200" fill="url(#orbB)"/>
  </g>
  <rect class="border" x=".5" y=".5" width="899" height="299" rx="22"/>

  <g class="fade d1"><text class="mono" x="56" y="78">~/ouro-preto <tspan class="accent">❯</tspan> whoami</text></g>
  <g class="fade d2"><text class="name" x="54" y="142">Davi Machado</text></g>

  <g class="fade d3">
    <text class="role" x="56" y="184">I build <tspan class="w w1 accent">websites that feel premium.</tspan></text>
    <text class="role" x="56" y="184"><tspan fill-opacity="0">I build </tspan><tspan class="w w2 accent">apps people come back to.</tspan></text>
    <text class="role" x="56" y="184"><tspan fill-opacity="0">I build </tspan><tspan class="w w3 accent">products from zero to launch.</tspan></text>
  </g>

  <g class="fade d4">
    <circle class="live pulse" cx="62" cy="246" r="5"/>
    <circle class="live" cx="62" cy="246" r="5"/>
    <text class="chiptext" x="76" y="251">Open to freelance projects</text>
    <rect class="chip" x="276" y="230" width="196" height="32" rx="16"/>
    <text class="chiptext" x="296" y="251">CS student at UFOP</text>
    <rect class="chip" x="484" y="230" width="150" height="32" rx="16"/>
    <text class="chiptext" x="504" y="251">Ouro Preto, BR</text>
  </g>
</svg>
